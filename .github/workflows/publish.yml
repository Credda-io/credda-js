name: publish

# Publishes this package to two registries on a version tag.
#
# 1. npmjs.org WITH provenance (the `publish` job). Provenance needs
#    `id-token: write` and a public source repo (this one is). It adds a
#    verified link on npmjs back to this repo and a Packages link in this
#    repo's sidebar. It does NOT populate the Credda-io org Packages tab.
#
# 2. GitHub Packages, npm.pkg.github.com (the `publish-gpr` job). That
#    registry is what github.com/orgs/Credda-io/packages lists. GitHub
#    Packages requires the npm scope to match the repository owner, so this
#    job republishes the same build under the @credda-io scope using the
#    built-in GITHUB_TOKEN. The public npmjs name (@credda/...) is unchanged.
#
# A published version cannot be unpublished, so releasing is gated on a tag.
# The tag version MUST match package.json, and that is now a step rather than
# this sentence: `on.push.tags: 'v*'` accepts any tag, so `v9.9.9` published
# whatever package.json said and both jobs went green. workflow_dispatch is
# available for a manual re-run, and carries no tag, so the check is skipped
# there rather than failed.
#
# HUMAN STEP: set an `NPM_TOKEN` repo secret (npm Automation token with
# publish rights on the @credda scope) under Settings, Secrets and variables,
# Actions. The GitHub Packages job needs no secret; it uses GITHUB_TOKEN.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag names the version being published
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./package.json').version")
          echo "tag $tag, package.json $version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not name version $version. A publish cannot be undone."
            exit 1
          fi
      # npm ci, not npm install: the lockfile is committed precisely so a
      # publish cannot re-resolve. A fresh resolve floats rollup to a version
      # whose native binaries are unpublished, which produces a broken package.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The suites build from src/ in process; this is the only thing that
      # starts what is about to be published. It ran on every pull request
      # and on no publish.
      - run: npm run example
      # The publish token comes from SSM over OIDC rather than from an Actions
      # secret.
      #
      # `NPM_TOKEN` was a Credda-io ORGANISATION secret with visibility `all`,
      # so every repository in the org -- including public ones that run
      # workflows over attacker-authored issue prose -- could reference the
      # credential that publishes @credda/* to npm. Nothing enforced that only
      # the three SDK repos used it; the scoping was a convention.
      #
      # `credda-github-publish` can read `/credda/release/*` and is explicitly
      # denied every other parameter, and its trust policy names these three
      # repositories on `refs/tags/v*` and `refs/heads/main` and nothing else.
      # So a workflow in another repo cannot assume it even if it tries, which
      # is the property the org secret could not have.
      #
      # `id-token: write` is already declared above for npm provenance, so this
      # needs no new permission.
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::940031346042:role/credda-github-publish
          aws-region: us-east-1
      # Masked before it is exported. A value read at runtime is not a secret as
      # far as Actions is concerned, so without `add-mask` it would appear in
      # plain text the first time any later step echoed the environment.
      - name: Read the npm publish token from SSM
        run: |
          TOKEN="$(aws ssm get-parameter --name /credda/release/NPM_TOKEN \
            --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$TOKEN"
          echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - run: npm publish --provenance --access public

  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@credda-io'
      - name: The tag names the version being published
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./package.json').version")
          echo "tag $tag, package.json $version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not name version $version. A publish cannot be undone."
            exit 1
          fi
      # npm ci, not npm install: the lockfile is committed precisely so a
      # publish cannot re-resolve. A fresh resolve floats rollup to a version
      # whose native binaries are unpublished, which produces a broken package.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Retarget the build to the Credda-io GitHub Packages scope
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.name=p.name.replace(/^@credda\//,'@credda-io/');p.publishConfig={registry:'https://npm.pkg.github.com'};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('publishing '+p.name+'@'+p.version+' to GitHub Packages');"
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This step is named Confirm and could not fail, for two independent
      # reasons: `continue-on-error: true`, and a loop that breaks on 200 and
      # otherwise falls off the end with no non-zero exit. It was a `curl` that
      # printed. Both are gone: a publish that does not appear under the org is
      # a red job, which is the only way anyone finds out.
      - name: Confirm the package is registered under the Credda-io org
        run: |
          set -uo pipefail
          UNSCOPED=$(node -e "console.log(require('./package.json').name.split('/')[1])")
          ENC=$(node -e "console.log(encodeURIComponent(require('./package.json').name))")
          for N in "$UNSCOPED" "$ENC"; do
            echo "== querying org package name=$N =="
            code=$(curl -sS -o resp.json -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/orgs/Credda-io/packages/npm/$N")
            echo "HTTP $code"; cat resp.json; echo
            if [ "$code" = "200" ]; then echo "CONFIRMED under org, package_name=$N"; exit 0; fi
          done
          echo "::error::Neither $UNSCOPED nor $ENC is listed under the Credda-io org after publishing."
          exit 1
