name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The worked example in examples/, run. It imports the BUILT package from
      # dist/ and asserts what comes back, so this is also the one check that
      # the published entry point resolves and the client survives a real HTTP
      # round trip. It needs no key and no network: the engine is a loopback
      # stub the script starts itself.
      - run: npm run example

  # surface-parity WAS HERE AND IS DELETED ON PURPOSE.
  #
  # It checked this package's surface against `monorepo/packages/sdk` in
  # Credda-io/api. That package was the trust SDK, and both it and the product
  # it spoke to are retired. This repository is no longer a mirror of anything
  # in that monorepo -- it is an independent client of the engine API -- so the
  # check has no subject left. Repointing it at the engine would have been
  # inventing a parity that does not exist; leaving it would have failed every
  # run, and a red check nobody can fix is how a suite stops being read.
  #
  # What replaced it lives in this repository and is stronger, because it does
  # not need a cross-repo token to run: `src/lib/surface.test.ts`
  # asserts the client's method list equals the engine's route list exactly and that no trust-era name has come back.
  #
  # MONOREPO_READ_TOKEN is now unused by this workflow and can be revoked.

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # GitHub's own secret scanning and push protection are not enabled on this
      # repo, so the scan runs here instead. The gitleaks container is used
      # directly rather than gitleaks-action, which needs an org licence key.
      - name: Scan the full history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --no-banner --verbose
